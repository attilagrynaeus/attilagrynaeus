name: Profile documentation QA

on:
  pull_request:
    paths:
      - README.md
      - 'docs/**'
      - 'assets/**'
      - 'profile/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/profile-qa.yml'
  push:
    branches: [main]
    paths:
      - README.md
      - 'docs/**'
      - 'assets/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/profile-qa.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run profile regression tests
        run: python3 -m unittest discover -s tests -p test_profile.py
      - name: Validate README links and SVGs
        run: python3 tools/validate_profile.py

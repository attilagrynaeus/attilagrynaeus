<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 148" width="1100" height="148" role="img" aria-labelledby="title desc"><title id="title">WORLD SIMULATION / SERVER AUTHORITY — One crop. One winner. Every client in sync.</title><desc id="desc">An original dark gradient project banner with restrained animated geometric details; respects reduced motion.</desc><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111B38"/><stop offset=".60" stop-color="#201A3D"/><stop offset="1" stop-color="#173E43"/></linearGradient><radialGradient id="radial"><stop stop-color="#6EE3C2" stop-opacity=".28"/><stop offset="1" stop-color="#6EE3C2" stop-opacity="0"/></radialGradient><pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#B2BDDF" opacity=".25"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.trail{stroke-dasharray:4 18;animation:march 9s linear infinite}.node{animation:glow 3.5s ease-in-out infinite alternate}@keyframes march{to{stroke-dashoffset:-176}}@keyframes glow{to{opacity:.36}}@media(prefers-reduced-motion:reduce){.trail,.node{animation:none}}</style><rect x="1" y="1" width="1098" height="146" rx="22" fill="url(#base)" stroke="#6EE3C2" stroke-opacity=".65" stroke-width="1.6"/><rect x="2" y="2" width="1096" height="144" rx="21" fill="url(#grid)"/><rect x="1" y="24" width="5" height="100" rx="3" fill="#6EE3C2"/><circle cx="1018" cy="74" r="102.11999999999999" fill="url(#radial)"/><text x="28" y="35" fill="#6EE3C2" font-size="14" font-weight="700" letter-spacing="1.45">WORLD SIMULATION / SERVER AUTHORITY</text><text x="28" y="84" fill="#F5F7FF" font-size="35" font-weight="740" letter-spacing="-.35">One crop. One winner. Every client in sync.</text><text x="29" y="119" fill="#B9C8E8" font-size="18">Scoped worlds  •  Replay-safe transactions  •  Browser proof</text><g fill="none" stroke="#6EE3C2" stroke-width="2.4" stroke-linejoin="round" opacity=".85"><path d="M951 48l30 -14 30 14v34l-30 15-30-15z"/><path d="M981 34v34m-30 -20l30 20 30-20m-30 20v30"/><path d="M1015 70h35l17 -12" class="trail"/></g><circle class="node" cx="1050" cy="58" r="5" fill="#A5FFE3"/></svg>
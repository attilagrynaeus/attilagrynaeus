    <rect x="836" y="84" width="83" height="58" rx="14" fill="#203050" stroke="#80efcd" stroke-opacity=".75"/>
    <text x="877.5" y="119" fill="#c3ffe9">GAME</text>
    <rect x="729" y="157" width="90" height="58" rx="14" fill="#332358" stroke="#baabff" stroke-opacity=".75"/>
    <text x="774" y="192" fill="#eee4ff">DATA</text>
  </g>
  <g fill="#82f2d0">
    <circle cx="786" cy="115" r="3"/>
    <circle cx="843" cy="154" r="3"/>
    <circle cx="681" cy="155" r="3"/>
  </g>
  <text x="786" y="261" fill="#afb4d7" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2">BUILD · VERIFY · EVOLVE</text>
</svg>
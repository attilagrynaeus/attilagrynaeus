<svg xmlns="http://www.w3.org/2000/svg" width="960" height="304" viewBox="0 0 960 304" role="img" aria-labelledby="title description">
  <title id="title">Attila Grynaeus — Software Architect</title>
  <desc id="description">Premium dark indigo banner with mint and violet accents, network architecture illustration, and engineering specializations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1025"/>
      <stop offset=".57" stop-color="#151638"/>
      <stop offset="1" stop-color="#241443"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#76efca"/>
      <stop offset="1" stop-color="#a59eff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7665ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7665ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#b6a8ff" stroke-opacity=".075"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <rect width="960" height="304" rx="22" fill="url(#bg)"/>
  <rect width="960" height="304" rx="22" fill="url(#grid)"/>
  <circle cx="791" cy="130" r="260" fill="url(#glow)"/>
  <path d="M0 271 Q280 218 516 269 T960 250" fill="none" stroke="#8f7bff" stroke-opacity=".25" stroke-width="2"/>
  <path d="M0 288 Q310 247 550 288 T960 278" fill="none" stroke="#80efcd" stroke-opacity=".16" stroke-width="2"/>
  <rect x="1" y="1" width="958" height="302" rx="21" fill="none" stroke="#9b8dff" stroke-opacity=".35"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="57" cy="46" r="4" fill="#7ef0ce">
      <animate attributeName="opacity" values=".5;1;.5" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <text x="72" y="51" fill="#8ff5d8" font-size="13" font-weight="700" letter-spacing="2.3">SOFTWARE ENGINEER / ARCHITECT</text>
    <text x="54" y="116" fill="#f8f8ff" font-size="48" font-weight="750" letter-spacing="-1.5">ATTILA GRYNAEUS</text>
    <text x="56" y="158" fill="url(#mint)" font-size="26" font-weight="600">Senior Software Architect</text>
    <text x="57" y="192" fill="#bfc4df" font-size="17">Java &amp; Spring  ·  AI Engineering  ·  Multiplayer Systems</text>
    <g font-size="13" font-weight="700">
      <rect x="56" y="226" width="115" height="37" rx="18" fill="#172b39" stroke="#70eccc" stroke-opacity=".38"/>
      <text x="113.5" y="249" fill="#a7f4dc" text-anchor="middle">JAVA / SPRING</text>
      <rect x="182" y="226" width="112" height="37" rx="18" fill="#262044" stroke="#b39cff" stroke-opacity=".42"/>
      <text x="238" y="249" fill="#d4c6ff" text-anchor="middle">CLOUD / OPS</text>
      <rect x="305" y="226" width="112" height="37" rx="18" fill="#172b39" stroke="#70eccc" stroke-opacity=".38"/>
      <text x="361" y="249" fill="#a7f4dc" text-anchor="middle">AI / AGENTS</text>
      <rect x="428" y="226" width="116" height="37" rx="18" fill="#262044" stroke="#b39cff" stroke-opacity=".42"/>
      <text x="486" y="249" fill="#d4c6ff" text-anchor="middle">GAME SYSTEMS</text>
    </g>
  </g>
  <g stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M686 101L786 68L877 111M686 101L773 186L877 111M786 68L773 186" stroke="#a89cff" stroke-opacity=".46"/>
    <path d="M686 101L786 68L877 111M686 101L773 186L877 111" stroke="#8ff6d6" stroke-opacity=".12" stroke-width="9" filter="url(#shadow)"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="645" y="74" width="92" height="55" rx="14" fill="#203050" stroke="#80efcd" stroke-opacity=".75"/>
    <text x="691" y="108" fill="#c3ffe9">API</text>
    <rect x="743" y="38" width="86" height="58" rx="14" fill="#332358" stroke="#baabff" stroke-opacity=".75"/>

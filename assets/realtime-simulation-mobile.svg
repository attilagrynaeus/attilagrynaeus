<text x="46" y="804" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="460" fill="#B2C3DE" >First reward</text>
</g>
<g class="blocked">
<rect x="201" y="741" width="161" height="91" rx="13" fill="#112335" stroke="#FF91A0" stroke-width="1.5"/>
<circle cx="223" cy="766" r="7" fill="#FF91A0" class="breathe"/>
<text x="239" y="772" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="780" fill="#FF91A0" >NO DUPLICATE</text>
<text x="220" y="804" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="460" fill="#B2C3DE" >Replay blocked</text>

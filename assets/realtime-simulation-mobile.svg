</g>
<text x="29" y="858" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="580" fill="#B2C3DE" letter-spacing=".35">CONCEPTUAL LOOP  /  NOT LIVE PRODUCTION METRICS</text>
</svg>
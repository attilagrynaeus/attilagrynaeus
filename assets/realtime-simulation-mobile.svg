<svg xmlns="http://www.w3.org/2000/svg" width="560" height="884" viewBox="0 0 560 884" role="img" aria-labelledby="title description">
<title id="title">Real-time multiplayer concurrency simulation</title>
<desc id="description">An animated conceptual demonstration: two browser players try to harvest the same crop. Node.js handles the real-time messages; Spring Boot commits the first inventory change, protects against duplicate rewards, and clients converge to the same state. PostgreSQL stores durable state, Redis coordinates world routing. This is an animated explanation, not live telemetry.</desc>
<defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1426"/><stop offset="1" stop-color="#172940"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#5796D7" stop-opacity=".30"/><stop offset="1" stop-color="#5796D7" stop-opacity="0"/></radialGradient>
    <pattern id="specks" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#B2C5E6" opacity=".19"/></pattern>
  </defs>
  <style>
  text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}
  .flow{stroke-dasharray:7 13;animation:flow 5s linear infinite}
  .breathe{animation:breathe 2s ease-in-out infinite alternate}
  .accepted{animation:accepted 6.8s linear infinite}
  .blocked{animation:blocked 6.8s linear infinite}
  .synced{animation:synced 6.8s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-160}}
  @keyframes breathe{to{opacity:.38}}
  @keyframes accepted{0%,12%{opacity:.37}20%,94%{opacity:1}100%{opacity:.37}}
  @keyframes blocked{0%,38%{opacity:.35}48%,94%{opacity:1}100%{opacity:.35}}
  @keyframes synced{0%,65%{opacity:.32}75%,94%{opacity:1}100%{opacity:.32}}
  @media(prefers-reduced-motion:reduce){.flow,.breathe,.accepted,.blocked,.synced{animation:none}animateMotion{display:none}}
  </style>
<rect x="1" y="1" width="558" height="882" rx="24" fill="url(#base)" stroke="#3F5879" stroke-width="1.6"/>
<rect x="1.5" y="1.5" width="557" height="881" rx="23" fill="url(#specks)"/>
<ellipse cx="408" cy="100" rx="190" ry="130" fill="url(#halo)"/>
<rect x="1" y="18" width="6" height="848" rx="3" fill="#5EE0C2"/>
<text x="28" y="43" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="780" fill="#8FD4FF" letter-spacing="1.1">REAL-TIME  /  MULTIPLAYER</text>
<text x="28" y="92" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="38" font-weight="790" fill="#F6F9FF" >One crop.</text>
<text x="28" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="38" font-weight="790" fill="#F6F9FF" >One reward.</text>
<text x="28" y="172" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="38" font-weight="790" fill="#F6F9FF" >Both clients in sync.</text>
<text x="28" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16" font-weight="480" fill="#B2C3DE" >Animated transaction flow, not live telemetry</text>
<rect x="27" y="242" width="242" height="106" rx="15" fill="#14243B" stroke="#8FD4FF" stroke-width="1.5"/>
<rect x="27" y="260" width="4" height="70" rx="2" fill="#8FD4FF"/>
<text x="47" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#8FD4FF" letter-spacing=".9">PLAYER A</text>
<text x="47" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >Browser</text>
<text x="47" y="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >Harvest request</text>
<rect x="290" y="242" width="242" height="106" rx="15" fill="#14243B" stroke="#8FD4FF" stroke-width="1.5"/>
<rect x="290" y="260" width="4" height="70" rx="2" fill="#8FD4FF"/>
<text x="310" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#8FD4FF" letter-spacing=".9">PLAYER B</text>
<text x="310" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >Browser</text>
<text x="310" y="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >Retry / competing action</text>
<rect x="27" y="395" width="242" height="121" rx="15" fill="#14243B" stroke="#B7A3FF" stroke-width="1.5"/>
<rect x="27" y="413" width="4" height="85" rx="2" fill="#B7A3FF"/>
<text x="47" y="423" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#B7A3FF" letter-spacing=".9">GAMEPLAY</text>
<text x="47" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >Node.js world</text>
<text x="47" y="498" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >Real-time simulation</text>
<rect x="290" y="395" width="242" height="121" rx="15" fill="#14243B" stroke="#5EE0C2" stroke-width="1.5"/>
<rect x="290" y="413" width="4" height="85" rx="2" fill="#5EE0C2"/>
<text x="310" y="423" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#5EE0C2" letter-spacing=".9">TRANSACTION</text>
<text x="310" y="454" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >Spring Boot</text>
<text x="310" y="498" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >Atomic reward write</text>
<rect x="27" y="583" width="242" height="107" rx="15" fill="#14243B" stroke="#8FD4FF" stroke-width="1.5"/>
<rect x="27" y="601" width="4" height="71" rx="2" fill="#8FD4FF"/>
<text x="47" y="611" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#8FD4FF" letter-spacing=".9">ROUTING</text>
<text x="47" y="642" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >Redis</text>
<text x="47" y="672" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >World directory</text>
<rect x="290" y="583" width="242" height="107" rx="15" fill="#14243B" stroke="#F2C17E" stroke-width="1.5"/>
<rect x="290" y="601" width="4" height="71" rx="2" fill="#F2C17E"/>
<text x="310" y="611" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="760" fill="#F2C17E" letter-spacing=".9">PERSISTENCE</text>
<text x="310" y="642" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="21" font-weight="760" fill="#F6F9FF" >PostgreSQL</text>
<text x="310" y="672" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="14" font-weight="470" fill="#B2C3DE" >Durable crop / inventory</text>
<path d="M148 348 V395" fill="none" stroke="#38516F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M148 348 V395" fill="none" stroke="#8FD4FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<path d="M411 348 V373 H148 V395" fill="none" stroke="#38516F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M411 348 V373 H148 V395" fill="none" stroke="#8FD4FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<path d="M269 456 H290" fill="none" stroke="#38516F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M269 456 H290" fill="none" stroke="#B7A3FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<path d="M148 516 V583" fill="none" stroke="#38516F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M148 516 V583" fill="none" stroke="#8FD4FF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<path d="M411 516 V583" fill="none" stroke="#38516F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
<path d="M411 516 V583" fill="none" stroke="#5EE0C2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
<circle r="7" fill="#8FD4FF" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1"><animateMotion path="M148 348 V395 H269 V456 H290" dur="6.8s" begin="0s" repeatCount="indefinite" calcMode="linear" /></circle>
<circle r="7" fill="#B7A3FF" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1"><animateMotion path="M411 348 V373 H148 V395 H269 V456 H290" dur="6.8s" begin="-2.1s" repeatCount="indefinite" calcMode="linear" /></circle>
<circle r="7" fill="#5EE0C2" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="1"><animateMotion path="M411 516 V583" dur="6.8s" begin="-3.6s" repeatCount="indefinite" calcMode="linear" /></circle>
<g class="accepted">
<rect x="27" y="741" width="161" height="91" rx="13" fill="#112335" stroke="#5EE0C2" stroke-width="1.5"/>

<text x="68.5" y="50" text-anchor="middle" font-size="14" font-weight="800" fill="#b9b3ff">AG.</text>
<text x="856" y="48" font-size="12" text-anchor="end" letter-spacing="1.5" fill="#858ca6">JAVA  /  SPRING  /  AGENTIC AI</text>
<rect x="54" y="122" width="9" height="9" rx="4.5" fill="#79dfc9"/>
<text x="73" y="131" font-size="12" letter-spacing="2.25" fill="#9ea7c5">SENIOR SOFTWARE &amp; AI ARCHITECT</text>
<text x="52" y="202" font-size="54" font-weight="730" letter-spacing="-2.25" fill="#f0f0fa">Hi, I'm Attila.</text>
<text x="54" y="244" font-size="22" font-weight="520" fill="#c6c9d9">I build software that holds up.</text>
<text x="54" y="281" font-size="16" fill="#9199af">Java/Spring platforms and LLM applications,</text>
<text x="54" y="307" font-size="16" fill="#9199af">agent integrations and multiplayer systems.</text>
<rect x="54" y="336" width="250" height="32" rx="16" fill="#1a1b37" stroke="#6862b1" stroke-opacity=".5"/>
<text x="179" y="356.6" text-anchor="middle" font-size="12" font-weight="600" letter-spacing=".45" fill="#b9c3ff">27+ YEARS IN ENTERPRISE SOFTWARE</text>
<text x="54" y="401" font-size="12" letter-spacing=".65" fill="#696e88">ARCHITECTURE  ·  AGENTIC AI  ·  DELIVERY</text>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">Attila Grynaeus</title>
  <desc id="desc">Java and Spring engineer. Software architecture, cloud and AI tooling.</desc>
  <defs>
    <linearGradient id="wave" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#274b77" stop-opacity=".05"/><stop offset=".5" stop-color="#638fc8" stop-opacity=".55"/><stop offset="1" stop-color="#8bc8c5" stop-opacity=".12"/></linearGradient>
  </defs>
  <style>
    .name{fill:#e6edf3;font:600 62px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:-2.2px}
    .role{fill:#9daec1;font:16px -apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;letter-spacing:1.1px}
    .wave{animation:drift 12s ease-in-out infinite alternate;transform-origin:450px 190px}
    .second{animation-delay:-6s}
    @keyframes drift{to{transform:translateY(-6px) scaleX(1.035)}}
    @media(prefers-color-scheme:light){.name{fill:#192c42}.role{fill:#50647a}}
    @media(prefers-reduced-motion:reduce){.wave{animation:none}}
  </style>
  <path class="wave" d="M0 180C150 145 260 205 450 175S740 149 900 178V220H0Z" fill="url(#wave)"/>
  <path class="wave second" d="M0 199C185 158 285 219 480 192S750 164 900 193" fill="none" stroke="#789fca" stroke-width="1" opacity=".45"/>
  <text class="name" x="450" y="97" text-anchor="middle">Attila Grynaeus</text>
  <text class="role" x="450" y="138" text-anchor="middle">JAVA &amp; SPRING  /  SOFTWARE ARCHITECTURE  /  AI TOOLS</text>
</svg>

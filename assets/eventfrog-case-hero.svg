<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-labelledby="title desc">
<title id="title">Eventfrog and ChatGPT — production MCP integration</title>
<desc id="desc">Dark indigo editorial engineering banner with three luminous tool nodes connected to a ChatGPT and Eventfrog data boundary.</desc>
<defs>

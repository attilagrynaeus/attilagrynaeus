<radialGradient id="glow"><stop stop-color="#665ac8" stop-opacity=".35"/><stop offset="1" stop-color="#665ac8" stop-opacity="0"/></radialGradient>
<filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
<style>
.spark{animation:shimmer 8s ease-in-out infinite alternate}@keyframes shimmer{to{opacity:.48;transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){.spark{animation:none}}
</style>
</defs>

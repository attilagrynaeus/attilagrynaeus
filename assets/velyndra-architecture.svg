<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
<title id="title">Velyndra — read-only AI integration</title><desc id="desc">An assistant calls three read-only MCP tools for categories, search and details. Validated tool calls access the existing business API and return authoritative event data. Kubernetes-based cloud deployment. Velyndra is a fictional client alias.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="520" height="910" viewBox="0 0 520 910" role="img" aria-labelledby="title desc">
<title id="title">Velyndra ChatGPT MCP logical architecture for mobile</title>
<desc id="desc">Vertical flow: ChatGPT app, MCP server with three read tools, API gateway, and Velyndra public event data. MCP and gateway run on Google Cloud Kubernetes.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1225"/><stop offset="1" stop-color="#18162e"/></linearGradient><linearGradient id="a" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#83e8d4"/><stop offset="1" stop-color="#b29bff"/></linearGradient></defs>
<rect width="520" height="910" rx="20" fill="url(#bg)"/><rect x="1" y="1" width="518" height="908" rx="19" stroke="#665d98" stroke-opacity=".66" fill="none"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="27" y="42" font-size="15" fill="#a8cffe" font-weight="700" letter-spacing="1.15">LOGICAL ARCHITECTURE</text><text x="27" y="65" font-size="13" fill="#aab1ce">Public read-only event discovery</text>
<rect x="43" y="93" width="434" height="141" rx="15" fill="#1a2240" stroke="#64719b"/><circle cx="75" cy="124" r="6" fill="#89e7d3"/><text x="93" y="131" fill="#f7f6ff" font-size="21" font-weight="700">ChatGPT app</text><text x="75" y="165" fill="#bdc7dc" font-size="16">User asks for an event in natural language.</text><text x="75" y="193" fill="#98a9ca" font-size="14">Assistant selects a typed tool call.</text>
<rect x="28" y="285" width="464" height="410" rx="18" fill="#171b37" stroke="#756cb5" stroke-dasharray="8 6"/><text x="51" y="314" fill="#aba4ed" letter-spacing="1" font-size="13" font-weight="700">CLOUD / KUBERNETES</text>
<rect x="48" y="341" width="424" height="236" rx="14" fill="#1a2944" stroke="#71939f"/><circle cx="78" cy="373" r="6" fill="#8de4d5"/><text x="95" y="380" font-size="20" font-weight="700" fill="#f7f6ff">MCP tool server</text><text x="76" y="410" font-size="14" fill="#a5b7d2">Schemas · input checks · localized results</text>
<rect x="76" y="432" width="365" height="38" rx="8" fill="#24414d" stroke="#5eaea3"/><text x="92" y="457" fill="#d5fff0" font-size="15">Categories</text><text x="423" y="455" fill="#8dccbf" font-size="13" text-anchor="end">categories</text>
<rect x="76" y="479" width="365" height="38" rx="8" fill="#2c2c4f" stroke="#8078bd"/><text x="92" y="504" fill="#e5d9ff" font-size="15">Event search</text><text x="423" y="502" fill="#c0b1e8" font-size="13" text-anchor="end">search</text>
<rect x="76" y="526" width="365" height="38" rx="8" fill="#2c2c4f" stroke="#8078bd"/><text x="92" y="551" fill="#e5d9ff" font-size="15">Event details</text><text x="423" y="549" fill="#c0b1e8" font-size="13" text-anchor="end">details</text>
<rect x="48" y="611" width="424" height="60" rx="12" fill="#26243f" stroke="#8478b5"/><text x="260" y="637" fill="#f1eefe" font-size="18" font-weight="700" text-anchor="middle">API gateway</text><text x="260" y="657" fill="#b0b6d0" font-size="13.5" text-anchor="middle">Bridge to the existing services</text>
<rect x="43" y="748" width="434" height="116" rx="15" fill="#193138" stroke="#5b9e92"/><circle cx="75" cy="782" r="6" fill="#88ead3"/><text x="93" y="789" font-size="20" font-weight="700" fill="#f1fff6">Velyndra services</text><text x="74" y="823" fill="#b6dacf" font-size="16">Published event data stays authoritative.</text>
</g>
<g stroke="url(#a)" fill="none" stroke-width="2.7" stroke-linecap="round"><path d="M260 236V281"/><path d="M252 273L260 281L268 273"/><path d="M260 697V744"/><path d="M252 736L260 744L268 736"/></g>
<path d="M28 882H492" stroke="#706a93" stroke-opacity=".45"/><text x="29" y="902" fill="#9da7c7" font-size="12" font-family="Segoe UI,Arial,sans-serif">Conceptual view — no private topology shown</text>
</svg>

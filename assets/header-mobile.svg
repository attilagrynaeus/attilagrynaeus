<text x="46.5" y="46" text-anchor="middle" font-size="13" font-weight="800" fill="#b9b3ff">AG.</text>
<text x="392" y="45" font-size="10" text-anchor="end" letter-spacing="1" fill="#858ca6">JAVA / SPRING / AI SYSTEMS</text>
<rect x="30" y="88" width="8" height="8" rx="4" fill="#79dfc9"/>
<text x="45" y="96" font-size="10.5" letter-spacing="1.8" fill="#a1a9c5">SOFTWARE &amp; AI ARCHITECT</text>
<text x="28" y="150" font-size="41" font-weight="730" letter-spacing="-1.6" fill="#f0f0fa">Hi, I'm Attila.</text>
<text x="30" y="183" font-size="18" font-weight="520" fill="#c6c9d9">I build software that holds up.</text>
<text x="30" y="213" font-size="13.5" fill="#969db4">Java/Spring, LLM apps and secure integrations,</text>
<text x="30" y="234" font-size="13.5" fill="#969db4">cloud platforms and multiplayer worlds.</text>
<rect x="30" y="259" width="250" height="30" rx="15" fill="#1a1b37" stroke="#6862b1" stroke-opacity=".5"/>
<text x="155" y="279" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b9c3ff">27+ YEARS IN ENTERPRISE SOFTWARE</text>
<path d="M28 514H392" stroke="#b7b5ed" stroke-opacity=".14"/>
<text x="210" y="537" text-anchor="middle" font-size="10.5" fill="#8185a2" letter-spacing=".55">ARCHITECTURE  ·  AGENTIC AI  ·  DELIVERY</text>
</g>

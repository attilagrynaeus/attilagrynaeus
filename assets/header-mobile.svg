<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="title desc">
<title id="title">Hi, I'm Attila — senior software engineer</title>
<desc id="desc">Mobile portfolio panel with readable introduction and a cyan-violet light sculpture.</desc>
<defs>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100f20"/><stop offset=".63" stop-color="#0b0d1b"/><stop offset="1" stop-color="#121329"/></linearGradient>
  <linearGradient id="filament" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7adfff"/><stop offset=".33" stop-color="#f5f7ff"/><stop offset=".63" stop-color="#b1a1ff"/><stop offset="1" stop-color="#d79aff"/></linearGradient>
  <linearGradient id="badge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6975ef"/><stop offset="1" stop-color="#808dff"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#5d52f7" stop-opacity=".36"/><stop offset="1" stop-color="#40349d" stop-opacity="0"/></radialGradient>
  <filter id="blurGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7"/></filter>
  <style>
    .sparkline{animation:flow 22s linear infinite}.line1{animation-duration:27s;animation-direction:reverse}
    .orb{animation:bob 6s ease-in-out infinite alternate}.orb2{animation-delay:-2.3s}
    @keyframes flow{to{stroke-dashoffset:-195}}
    @keyframes bob{to{transform:translateY(-9px)}}
    @media(prefers-reduced-motion: reduce){.sparkline,.orb{animation:none}}
  </style>
</defs>

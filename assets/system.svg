<text x="556" y="490" font-size="12" fill="#61748C" font-weight="500">Trusted API</text>
<g id="api-postgres"><path d="M734 461V495H716V526" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<g id="api-directory"><path d="M917 461V495H940V526" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>

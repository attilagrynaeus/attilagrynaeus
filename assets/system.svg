<g class="component"><g filter="url(#shadow)"><rect x="610" y="341" width="430" height="120" rx="18" fill="#EAF6F3" stroke="#83C9B3" stroke-width="1.8"/></g><rect x="628" y="364" width="74" height="74" rx="17" fill="#FFFFFF" opacity=".8"/><g transform="translate(635 371) scale(1)" fill="none" stroke="#218463" color="#218463" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 48C-1 24 24 3 54 8C57 41 30 61 12 48Z"/><path d="M10 53C18 38 31 31 45 20M20 39L19 25M31 30L44 31"/></g><text x="718" y="368" font-size="12" fill="#218463" font-weight="700" letter-spacing="1.1">DURABLE AUTHORITY</text><text x="718" y="397" font-size="26" fill="#17263E" font-weight="750">Spring Boot API</text><text x="718" y="424" font-size="17" fill="#52647E" font-weight="400">Accounts, economy + inventory</text><text x="718" y="447" font-size="17" fill="#52647E" font-weight="400">Atomic writes + replay protection</text></g>
<g class="component"><g filter="url(#shadow)"><rect x="610" y="526" width="212" height="120" rx="18" fill="#FFF3E4" stroke="#E8BA79" stroke-width="1.8"/></g><g transform="translate(628 541) scale(0.55)" fill="none" stroke="#A86C22" color="#A86C22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="32" cy="13" rx="24" ry="9"/><path d="M8 13V48C8 60 56 60 56 48V13M8 30C8 42 56 42 56 30"/></g><text x="674" y="565" font-size="24" fill="#17263E" font-weight="700">PostgreSQL</text><text x="630" y="599" font-size="17" fill="#52647E" font-weight="400">Durable state</text><text x="630" y="622" font-size="17" fill="#52647E" font-weight="400">Transaction records</text></g>

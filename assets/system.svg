<g id="client-api"><path d="M655 265V303H825V341" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="772.0" y="278" width="106" height="23" rx="7" fill="#F9FBFE"/><text x="825" y="294" font-size="15" fill="#536781" font-weight="500" text-anchor="middle">HTTPS / SSE</text></g>
<g id="gateway-runtime"><path d="M280 461V526" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="191.0" y="486" width="178" height="23" rx="7" fill="#F9FBFE"/><text x="280" y="502" font-size="15" fill="#536781" font-weight="500" text-anchor="middle">Validated connection</text></g>

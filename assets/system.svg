<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="462" viewBox="0 0 1100 462" role="img" aria-labelledby="title desc">
<title id="title">ShardForge Farm - multiplayer authority map</title>
<desc id="desc">Browser and Portal send HTTPS directly to Spring and authenticated WebSocket traffic to a gateway, then a Node world runtime. Node calls Spring for durable gameplay transactions. Spring uses PostgreSQL for persistence and a Redis-backed directory for world routing.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1025"/><stop offset="1" stop-color="#201638"/></linearGradient>
<linearGradient id="client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263B78"/><stop offset="1" stop-color="#1B2B50"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#666A93" opacity=".25"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#97ABD5" stroke-width="1.6"/></marker>
</defs>

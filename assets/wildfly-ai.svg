<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">WildFly AI Assist — From errors to suggested fixes</title>
  <desc id="description">Concept art of a server log being connected to documentation and a suggested repair.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15122d"/><stop offset="1" stop-color="#1c2840"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#b29cff"/><stop offset="1" stop-color="#86f3d5"/></linearGradient>
  </defs>
  <rect width="960" height="240" rx="19" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="238" rx="18" fill="none" stroke="#a794ff" stroke-opacity=".49"/>
  <circle cx="924" cy="25" r="170" fill="#7d5fff" opacity=".07"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="47" y="43" fill="#beb0ff" font-size="12" font-weight="700" letter-spacing="2.4">AI-ASSISTED TROUBLESHOOTING</text>
    <text x="46" y="96" fill="#f8f8ff" font-size="40" font-weight="740">WildFly AI Assist</text>

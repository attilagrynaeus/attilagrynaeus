    <text x="48" y="163" fill="#a8add1" font-size="15">Retrieval  ·  Internal knowledge  ·  Suggested resolution</text>
    <g font-size="12" font-weight="700">
      <rect x="47" y="187" width="78" height="27" rx="13" fill="#31284e"/><text x="86" y="205" text-anchor="middle" fill="#d6c7ff">PYTHON</text>
      <rect x="134" y="187" width="73" height="27" rx="13" fill="#17383e"/><text x="170.5" y="205" text-anchor="middle" fill="#a3f2df">RAG</text>
      <rect x="216" y="187" width="76" height="27" rx="13" fill="#31284e"/><text x="254" y="205" text-anchor="middle" fill="#d6c7ff">FASTAPI</text>
    </g>
  </g>
  <g font-family="Consolas, Menlo, monospace">
    <rect x="566" y="31" width="347" height="178" rx="14" fill="#0b1326" stroke="#5a557e"/>
    <rect x="566" y="31" width="347" height="29" rx="13" fill="#27273f"/>
    <path d="M566 45H913V60H566Z" fill="#27273f"/>
    <circle cx="584" cy="46" r="4" fill="#fd8f9a"/><circle cx="597" cy="46" r="4" fill="#ffc177"/><circle cx="610" cy="46" r="4" fill="#86e7ce"/>
    <text x="629" y="50" fill="#c8c1f7" font-size="11">server.log → AI assist</text>
    <rect x="581" y="75" width="315" height="40" rx="7" fill="#2c213b"/>

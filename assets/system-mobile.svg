<svg xmlns="http://www.w3.org/2000/svg" width="480" height="675" viewBox="0 0 480 675" role="img" aria-labelledby="title desc">
<title id="title">ShardForge Farm - mobile architecture</title>
<desc id="desc">Browser and Portal connect using WebSocket gateway to the Node world shard and HTTPS to Spring API. Node uses Spring for durable game transactions. Spring owns PostgreSQL persistence and Redis-backed world routing.</desc>

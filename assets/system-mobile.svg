<svg xmlns="http://www.w3.org/2000/svg" width="480" height="950" viewBox="0 0 480 950" role="img" aria-labelledby="title desc">
<title id="title">ShardForge Farm — runtime architecture</title><desc id="desc">Browser sends WebSocket requests to the authenticated gateway and HTTPS requests directly to Spring. Node owns live gameplay and calls Spring for durable writes. PostgreSQL stores state. Redis provides the world directory. The same architecture is shown on desktop and mobile.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style>
<defs><linearGradient id="paper" x2="0.8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F8FE"/></linearGradient><linearGradient id="navy" x2="1" y2="1"><stop stop-color="#111C36"/><stop offset="1" stop-color="#192B44"/></linearGradient><filter id="shadow" x="-15%" y="-25%" width="130%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#123269" flood-opacity=".07"/></filter><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#8394AC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="478" height="948" rx="24" fill="url(#paper)" stroke="#DCE5F2" stroke-width="1.5"/>
<text x="26" y="34" font-size="13" fill="#386FA7" font-weight="700" letter-spacing="1.4">SHARDFORGE FARM</text>
<text x="26" y="73" font-size="27" fill="#17263E" font-weight="750">One world. Clear owners.</text>
<text x="26" y="103" font-size="17" fill="#61748C" font-weight="400">Runtime architecture</text>
<g id="client-gateway"><path d="M223 250V285" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="241.0" y="259" width="90" height="23" rx="7" fill="#F9FBFE"/><text x="286" y="275" font-size="15" fill="#536781" font-weight="500" text-anchor="middle">WebSocket</text></g>
<g id="client-api"><path d="M422 190H454V637H422" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<text x="431" y="414" font-size="12" fill="#61748C" font-weight="600" text-anchor="middle">HTTPS</text>
<text x="431" y="432" font-size="12" fill="#61748C" font-weight="600" text-anchor="middle">+ SSE</text>
<g id="gateway-runtime"><path d="M223 405V440" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<g id="runtime-api"><path d="M223 560V595" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="232.0" y="569" width="106" height="23" rx="7" fill="#F9FBFE"/><text x="285" y="585" font-size="15" fill="#536781" font-weight="500" text-anchor="middle">Trusted API</text></g>
<g id="api-postgres"><path d="M153 715V753H132V780" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<g id="api-directory"><path d="M309 715V753H350V780" fill="none" stroke="#8394AC" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/></g>
<g class="component"><g filter="url(#shadow)"><rect x="26" y="130" width="396" height="120" rx="18" fill="#EAF2FF" stroke="#83ACED" stroke-width="1.8"/></g><rect x="44" y="153" width="74" height="74" rx="17" fill="#FFFFFF" opacity=".8"/><g transform="translate(51 160) scale(1)" fill="none" stroke="#2464C6" color="#2464C6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="48" height="32" rx="4"/><path d="M19 50H39M29 41V50"/><rect x="42" y="26" width="17" height="29" rx="3"/><path d="M48 49H52"/></g><text x="134" y="157" font-size="12" fill="#2464C6" font-weight="700" letter-spacing="1.1">PRESENTATION</text><text x="134" y="186" font-size="26" fill="#17263E" font-weight="750">Player / Browser</text><text x="134" y="213" font-size="17" fill="#52647E" font-weight="400">Game + Portal</text><text x="134" y="236" font-size="17" fill="#52647E" font-weight="400">Input, UI and rendering</text></g>
<g class="component"><g filter="url(#shadow)"><rect x="26" y="285" width="396" height="120" rx="18" fill="#F0EBFF" stroke="#BCA8ED" stroke-width="1.8"/></g><rect x="44" y="308" width="74" height="74" rx="17" fill="#FFFFFF" opacity=".8"/><g transform="translate(51 315) scale(1)" fill="none" stroke="#7650BB" color="#7650BB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14L8 32L20 50M44 14L56 32L44 50M37 13L27 51"/><circle cx="32" cy="4" r="2" fill="currentColor" stroke="none"/></g><text x="134" y="312" font-size="12" fill="#7650BB" font-weight="700" letter-spacing="1.1">INGRESS</text><text x="134" y="341" font-size="26" fill="#17263E" font-weight="750">WebSocket gateway</text><text x="134" y="368" font-size="17" fill="#52647E" font-weight="400">Connect-token validation</text><text x="134" y="391" font-size="17" fill="#52647E" font-weight="400">Route to the assigned world</text></g>

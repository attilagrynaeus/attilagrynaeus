<svg xmlns="http://www.w3.org/2000/svg" width="440" height="414" viewBox="0 0 440 414" role="img" aria-labelledby="title desc">
  <title id="title">R.A.M. FARM system boundaries</title>
  <desc id="desc">Browser input flows through the Node.js simulation to Java/Spring transactions and PostgreSQL. Versioned, confirmed state returns to clients.</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#7b9dbc" stroke-width="1.2"/></marker></defs>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.name{font-size:20px;font-weight:600;fill:#e6edf3}.detail{font-size:15px;fill:#a3b5c6}.label{font:12px ui-monospace,Consolas,monospace;fill:#91a3b6;letter-spacing:.4px}</style>
  <rect x=".5" y=".5" width="439" height="413" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="22" y="30" class="label">R.A.M. FARM / SYSTEM BOUNDARIES</text>
  <g fill="#141d27" stroke="#34475c">
    <rect x="22" y="52" width="342" height="64" rx="6"/>
    <rect x="22" y="136" width="342" height="64" rx="6"/>
    <rect x="22" y="220" width="342" height="64" rx="6"/>
    <rect x="22" y="304" width="342" height="64" rx="6"/>
  </g>
  <text x="38" y="79" class="name">Browser clients</text><text x="38" y="102" class="detail">Input and rendering · send intent</text>
  <text x="38" y="163" class="name">Node.js world runtime</text><text x="38" y="186" class="detail">Simulation · scope · command checks</text>
  <text x="38" y="247" class="name">Java / Spring</text><text x="38" y="270" class="detail">Inventory and ownership transactions</text>
  <text x="38" y="331" class="name">PostgreSQL</text><text x="38" y="354" class="detail">Persisted facts · replay protection</text>
  <g fill="none" stroke="#7b9dbc" stroke-width="1.4" marker-end="url(#arrow)"><path d="M193 117V132"/><path d="M193 201V216"/><path d="M193 285V300"/><path d="M366 168H401V84H368"/></g>
  <text x="22" y="395" class="label">Confirmed, versioned state returns to clients</text>

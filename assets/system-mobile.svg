<g class="component"><g filter="url(#shadow)"><rect x="26" y="595" width="396" height="120" rx="18" fill="#EAF6F3" stroke="#83C9B3" stroke-width="1.8"/></g><rect x="44" y="618" width="74" height="74" rx="17" fill="#FFFFFF" opacity=".8"/><g transform="translate(51 625) scale(1)" fill="none" stroke="#218463" color="#218463" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 48C-1 24 24 3 54 8C57 41 30 61 12 48Z"/><path d="M10 53C18 38 31 31 45 20M20 39L19 25M31 30L44 31"/></g><text x="134" y="622" font-size="12" fill="#218463" font-weight="700" letter-spacing="1.1">DURABLE AUTHORITY</text><text x="134" y="651" font-size="26" fill="#17263E" font-weight="750">Spring Boot API</text><text x="134" y="678" font-size="17" fill="#52647E" font-weight="400">Economy + inventory</text><text x="134" y="701" font-size="17" fill="#52647E" font-weight="400">Atomic writes + replay checks</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1140" viewBox="0 0 1440 1140" role="img" aria-labelledby="archTitle archDesc">
<title id="archTitle">RAM FARM: AWS target deployment architecture</title><desc id="archDesc">Conceptual AWS deployment topology, not a live production deployment. A player browser receives static assets from CloudFront and S3, calls Spring Boot through CloudFront and an API load balancer, and uses WebSockets via a second load balancer and an authenticated gateway to a private Node.js world shard. Node calls Spring Boot for durable transactions. Spring uses PostgreSQL; Redis is the world-routing directory. A separate single-host EC2 test stack has been validated.</desc>

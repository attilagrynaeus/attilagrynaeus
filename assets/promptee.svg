<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title description">
  <title id="title">PrompTee — Collaborative Prompt Management</title>
  <desc id="description">Conceptual interface artwork showing a prompt workspace, sidebar, and prompt cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11172e"/><stop offset="1" stop-color="#172b3c"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" width="480" height="150" role="img" aria-labelledby="title desc"><title id="title">ENTERPRISE CLOUD / JAVA &amp; SPRING — BUILD. SHIP. OPERATE.</title><desc id="desc">An original dark gradient project banner with restrained animated geometric details; respects reduced motion.</desc><defs><linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111B38"/><stop offset=".60" stop-color="#201A3D"/><stop offset="1" stop-color="#493329"/></linearGradient><radialGradient id="radial"><stop stop-color="#F2B777" stop-opacity=".28"/><stop offset="1" stop-color="#F2B777" stop-opacity="0"/></radialGradient><pattern id="grid" width="21" height="21" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#B2BDDF" opacity=".25"/></pattern></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.trail{stroke-dasharray:4 18;animation:march 9s linear infinite}.node{animation:glow 3.5s ease-in-out infinite alternate}@keyframes march{to{stroke-dashoffset:-176}}@keyframes glow{to{opacity:.36}}@media(prefers-reduced-motion:reduce){.trail,.node{animation:none}}</style><rect x="1" y="1" width="478" height="148" rx="22" fill="url(#base)" stroke="#F2B777" stroke-opacity=".65" stroke-width="1.6"/><rect x="2" y="2" width="476" height="146" rx="21" fill="url(#grid)"/><rect x="1" y="24" width="5" height="102" rx="3" fill="#F2B777"/><circle cx="398" cy="75" r="103.49999999999999" fill="url(#radial)"/><text x="28" y="35" fill="#F2B777" font-size="14" font-weight="700" letter-spacing="1.45">ENTERPRISE CLOUD</text><text x="28" y="84" fill="#F5F7FF" font-size="26" font-weight="740" letter-spacing="-.35">BUILD. SHIP. OPERATE.</text><text x="29" y="119" fill="#B9C8E8" font-size="16">Java · Pricing · GitOps</text><circle cx="449" cy="32" r="5" fill="#F2B777" class="node"/></svg>